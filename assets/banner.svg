<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear & Radial Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <radialGradient id="glowPurple" cx="15%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for soft shadows & glows -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .pulsing-orb {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .moving-node-1 {
        animation: floatA 8s ease-in-out infinite alternate;
      }
      .moving-node-2 {
        animation: floatB 9s ease-in-out infinite alternate;
      }
      .moving-node-3 {
        animation: floatC 7s ease-in-out infinite alternate;
      }
      .network-line {
        stroke-dasharray: 6 6;
        animation: dash 25s linear infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.6; }
        100% { transform: scale(1.1); opacity: 0.9; }
      }
      @keyframes floatA {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-12px) translateX(8px); }
      }
      @keyframes floatB {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(14px) translateX(-10px); }
      }
      @keyframes floatC {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-8px) translateX(-6px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs (Dynamic pulse animation) -->
  <circle cx="180" cy="110" r="240" fill="url(#glowPurple)" class="pulsing-orb" />
  <circle cx="1020" cy="310" r="260" fill="url(#glowCyan)" class="pulsing-orb" style="animation-delay: -3s;" />
  <circle cx="600" cy="200" r="300" fill="url(#glowIndigo)" />

  <!-- Geometric Grid Layer -->
  <rect width="100%" height="100%" fill="url(#gridPattern)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS: Abstract Referral Network Links & Flowing Nodes -->
  <g opacity="0.45">
    <!-- Connecting network lines -->
    <path d="M 80,340 C 240,280 320,380 460,340 S 760,380 940,320 S 1120,360 1160,320" 
          fill="none" stroke="#6366f1" stroke-width="2" class="network-line" />
    <path d="M 120,80 C 300,160 480,40 680,100 S 980,60 1100,120" 
          fill="none" stroke="#06b6d4" stroke-width="1.8" class="network-line" style="animation-direction: reverse; animation-duration: 35s;" />

    <!-- Animated Network Data Packets -->
    <g class="moving-node-1">
      <circle cx="140" cy="280" r="6" fill="#38bdf8" />
      <circle cx="140" cy="280" r="14" fill="#38bdf8" opacity="0.25" />
    </g>
    <g class="moving-node-2">
      <circle cx="1060" cy="130" r="7" fill="#c084fc" />
      <circle cx="1060" cy="130" r="16" fill="#c084fc" opacity="0.25" />
    </g>
    <g class="moving-node-3">
      <circle cx="600" cy="360" r="5" fill="#34d399" />
      <circle cx="600" cy="360" r="12" fill="#34d399" opacity="0.2" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badges & Ecosystem Tags -->
  <g id="foregroundContent">
    <!-- Top Pill / Category Tag -->
    <g transform="translate(600, 56)" filter="url(#badgeShadow)">
      <rect x="-185" y="-18" width="370" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="1.5" text-anchor="middle">
        ✨ CURATED ECOSYSTEM &amp; FRAMEWORKS
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="44" font-weight="800" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-0.5">
      Employee &amp; Customer Referral Management
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="20" font-weight="500" fill="url(#highlightGrad)" text-anchor="middle" letter-spacing="0.2">
      Open-Source Tracking Engines • Enterprise SaaS • Growth Infrastructure
    </text>

    <!-- Description Details -->
    <text x="600" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="15" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Self-hosted affiliate attribution, reward automation, fraud prevention ledger &amp; referral advocacy portals
    </text>

    <!-- Feature Cards / Badges Row in Foreground -->
    <g transform="translate(600, 300)">
      <!-- Card 1: Referral Tracking -->
      <g transform="translate(-410, -35)" filter="url(#badgeShadow)">
        <rect x="0" y="0" width="250" height="70" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="24" y="32" font-size="20">👥</text>
        <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Customer Advocacy</text>
        <text x="56" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Word-of-mouth &amp; viral loops</text>
      </g>

      <!-- Card 2: Open Source Infrastructure -->
      <g transform="translate(-135, -35)" filter="url(#badgeShadow)">
        <rect x="0" y="0" width="270" height="70" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" />
        <text x="24" y="32" font-size="20">⚡</text>
        <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#818cf8">Open-Source Engines</text>
        <text x="56" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">Self-hosted &amp; zero rev-share</text>
      </g>

      <!-- Card 3: Employee Referrals -->
      <g transform="translate(160, -35)" filter="url(#badgeShadow)">
        <rect x="0" y="0" width="250" height="70" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="24" y="32" font-size="20">💼</text>
        <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Employee Referrals</text>
        <text x="56" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Internal talent sourcing</text>
      </g>
    </g>

    <!-- Bottom Architecture Indicator Pills -->
    <g transform="translate(600, 385)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" 
            font-size="12" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="1">
        DOCKER • CLOUDFLARE WORKERS • POSTGRESQL • NEXT.JS • PYTHON/DJANGO • LARAVEL • GO
      </text>
    </g>
  </g>
</svg>
